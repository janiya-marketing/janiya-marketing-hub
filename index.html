 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANIYA Customer Marketing System</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<!-- SIDEBAR -->

<aside class="sidebar">

<div class="logo">

<h2>JANIYA</h2>
<p>Customer Marketing</p>

</div>


<nav>

<button class="menu-btn active" data-page="dashboard">
Dashboard
</button>


<button class="menu-btn" data-page="customers">
Customers
</button>


<button class="menu-btn" data-page="communication">
Communication
</button>


<button class="menu-btn" data-page="marketing">
Marketing
</button>


<button class="menu-btn" data-page="automation">
Automation
</button>


<button class="menu-btn" data-page="settings">
Settings
</button>


</nav>

</aside>





<!-- MAIN CONTENT -->

<main class="main">



<!-- DASHBOARD -->

<section id="dashboard" class="page active-page">


<h1>Dashboard</h1>


<div class="cards">


<div class="card">

<h3>Total Customers</h3>

<p id="totalCustomers">
0
</p>

</div>


<div class="card">

<h3>Messages</h3>

<p id="totalMessages">
0
</p>

</div>


</div>


</section>





<!-- CUSTOMERS -->

<section id="customers" class="page">


<h1>Customers</h1>


<button id="addCustomerBtn">
Add Customer
</button>



<div id="customerForm">


<input 
id="customerName"
placeholder="Customer Name">


<input 
id="customerPhone"
placeholder="Phone Number">


<input 
id="customerEmail"
placeholder="Email">


<select id="customerGroup">

<option>
Regular
</option>

<option>
VIP
</option>

<option>
Wholesale
</option>

</select>


<button id="saveCustomer">
Save Customer
</button>


</div>



<input 
id="searchCustomer"
placeholder="Search customer...">


<table>


<thead>

<tr>

<th>Name</th>

<th>Phone</th>

<th>Group</th>

<th>Email</th>

<th>Date</th>

</tr>

</thead>


<tbody id="customerList">

</tbody>


</table>



</section>







<!-- COMMUNICATION -->

<section id="communication" class="page">


<h1>Communication Center</h1>


<select id="messageCustomer">

<option value="">
Select Customer
</option>


</select>



<textarea 
id="messageText"
placeholder="Write message">

</textarea>



<button id="sendWhatsApp">
Send WhatsApp
</button>


<button id="sendSMS">
Send SMS
</button>


<button id="sendAllSMS">
Send SMS To All
</button>



</section>







<!-- MARKETING -->

<section id="marketing" class="page">


<h1>Marketing</h1>


<textarea 
id="marketingMessage"
placeholder="Promotion message">

</textarea>


<button id="sendMarketing">

Send Promotion

</button>


</section>







<!-- AUTOMATION -->

<section id="automation" class="page">


<h1>Automation</h1>


<label>

<input 
type="checkbox"
id="thankYouEnabled">

Enable Thank You Messages

</label>


<br><br>


<label>

Send Time:

<input 
type="time"
id="thankYouTime"
value="18:00">

</label>


<br><br>


<button id="saveAutomation">

Save Automation

</button>



</section>







<!-- SETTINGS -->

<section id="settings" class="page">


<h1>Settings</h1>


<p>
JANIYA Customer Marketing System
</p>


</section>



</main>


</div>




<script src="app.js"></script>


</body>

</html>

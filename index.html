 <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANIYA Customer Marketing System</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        <h2>JANIYA</h2>
        <p>Customer Marketing</p>
    </div>


    <nav>

        <button class="menu-btn active" data-page="dashboard">
            Dashboard
        </button>


        <button class="menu-btn" data-page="customers">
            Customers
        </button>


        <button class="menu-btn" data-page="communication">
            Communication
        </button>


        <button class="menu-btn" data-page="marketing">
            Marketing
        </button>


        <button class="menu-btn" data-page="automation">
            Automation
        </button>


        <button class="menu-btn" data-page="settings">
            Settings
        </button>


    </nav>


</aside>





<!-- ================= MAIN CONTENT ================= -->

<main class="content">





<!-- DASHBOARD -->

<section id="dashboard" class="page active">


<h1>Dashboard</h1>


<div class="cards">


<div class="card">

<h3>Total Customers</h3>

<h2 id="totalCustomers">
0
</h2>

</div>



<div class="card">

<h3>SMS Sent</h3>

<h2 id="smsCount">
0
</h2>

</div>




<div class="card">

<h3>WhatsApp Sent</h3>

<h2 id="whatsappCount">
0
</h2>

</div>


</div>


</section>







<!-- CUSTOMERS -->

<section id="customers" class="page">


<h1>Customers</h1>



<div class="customer-form">


<input 
type="text"
id="customerName"
placeholder="Customer Name"
>



<input 
type="text"
id="customerPhone"
placeholder="Phone Number"
>



<select id="customerGroup">


<option value="Regular">
Regular
</option>


<option value="VIP">
VIP
</option>


<option value="Wholesale">
Wholesale
</option>


</select>




<textarea
id="customerNotes"
placeholder="Customer notes (optional)">
</textarea>



<button id="saveCustomer">
Save Customer
</button>


</div>





<input
id="searchCustomer"
placeholder="Search customer..."
>




<table id="customerTable">


<thead>


<tr>

<th>Name</th>

<th>Phone</th>

<th>Group</th>

<th>Date Added</th>

<th>Actions</th>


</tr>


</thead>


<tbody>

</tbody>


</table>



</section>







<!-- COMMUNICATION -->

<section id="communication" class="page">


<h1>Communication</h1>



<select id="messageCustomer">

<option>
Select Customer
</option>

</select>



<textarea
id="messageText"
placeholder="Write your message">
</textarea>



<div class="buttons">


<button id="sendWhatsApp">
Send WhatsApp
</button>


<button id="sendSMS">
Send SMS
</button>



</div>



</section>








<!-- MARKETING -->

<section id="marketing" class="page">


<h1>Marketing</h1>



<textarea
id="promotionMessage"
placeholder="Write promotion message">
</textarea>



<button id="copyPromotion">
Copy Message
</button>


</section>








<!-- AUTOMATION -->

<section id="automation" class="page">


<h1>Thank You Message Automation</h1>




<label>

<input 
type="checkbox"
id="thankYouEnabled"
>

Enable Thank You Messages

</label>





<br><br>



<label>
Send Method:
</label>


<select id="thankYouMethod">


<option value="whatsapp">
WhatsApp
</option>


<option value="sms">
SMS
</option>


</select>





<br><br>




<label>
Send Time:
</label>


<input 
type="time"
id="thankYouTime"
value="18:00"
>




<textarea
id="thankYouMessage"
placeholder="Thank you message">

Hello {name},

Thank you for shopping with JANIYA.

We appreciate your support.

</textarea>




<button id="saveAutomation">

Save Automation

</button>



</section>









<!-- SETTINGS -->

<section id="settings" class="page">


<h1>Settings</h1>



<button id="exportCustomers">
Export Customers
</button>



<button id="clearCustomers">
Delete All Customers
</button>



</section>





</main>


</div>





<script src="app.js"></script>


</body>

</html>

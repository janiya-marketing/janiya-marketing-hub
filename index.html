 <!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JANIYA Customer Marketing System</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>JANIYA</h2>
            <p>Marketing System</p>
        </div>

        <nav>

            <button class="menu-btn active" data-page="dashboard">
                Dashboard
            </button>

            <button class="menu-btn" data-page="customers">
                Customers
            </button>

            <button class="menu-btn" data-page="communication">
                Communication
            </button>

            <button class="menu-btn" data-page="marketing">
                Marketing
            </button>

            <button class="menu-btn" data-page="settings">
                Settings
            </button>

        </nav>

    </aside>

    <!-- Main Content -->
    <main class="content">

        <!-- Dashboard -->
        <section id="dashboard" class="page active">

            <h1>Dashboard</h1>

            <div class="cards">

                <div class="card">
                    <h3>Total Customers</h3>
                    <h2 id="totalCustomers">0</h2>
                </div>

                <div class="card">
                    <h3>WhatsApp Messages</h3>
                    <h2 id="whatsappCount">0</h2>
                </div>

                <div class="card">
                    <h3>SMS Messages</h3>
                    <h2 id="smsCount">0</h2>
                </div>

            </div>

        </section>

        <!-- Customers -->
        <section id="customers" class="page">

            <h1>Customers</h1>

            <div class="customer-form">

                <input
                    type="text"
                    id="customerName"
                    placeholder="Customer Name"
                >

                <input
                    type="text"
                    id="customerPhone"
                    placeholder="Phone Number"
                >

                <select id="customerGroup">

                    <option value="Regular">Regular</option>

                    <option value="VIP">VIP</option>

                    <option value="Wholesale">Wholesale</option>

                </select>

                <button id="saveCustomer">
                    Save Customer
                </button>

            </div>

            <input
                type="text"
                id="searchCustomer"
                placeholder="Search Customer..."
            >

            <table id="customerTable">

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Phone</th>
                        <th>Group</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </section>

        <!-- Communication -->
        <section id="communication" class="page">

            <h1>Communication</h1>

            <select id="messageCustomer"></select>

            <textarea
                id="messageText"
                placeholder="Type your message..."
            ></textarea>

            <div class="buttons">

                <button id="sendWhatsApp">
                    Send WhatsApp
                </button>

                <button id="sendSMS">
                    Send SMS
                </button>

            </div>

        </section>

        <!-- Marketing -->
        <section id="marketing" class="page">

            <h1>Marketing</h1>

            <textarea
                id="promotionMessage"
                placeholder="Promotion message..."
            ></textarea>

            <button id="copyPromotion">
                Copy Promotion
            </button>

        </section>

        <!-- Settings -->
        <section id="settings" class="page">

            <h1>Settings</h1>

            <button id="exportCustomers">
                Export Customers
            </button>

            <button id="clearCustomers">
                Delete All Customers
            </button>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
